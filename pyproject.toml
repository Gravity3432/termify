[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "termify"
version = "0.6.3"
description = "A slick terminal-based Spotify client — plays your music right in the command line."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "John The Mail Boy", email = "johnthemailboy@users.noreply.github.com" }]
keywords = ["spotify", "cli", "terminal", "tui", "music", "player"]
dependencies = [
    "spotipy>=2.23",
    "librespot>=0.0.9",
    "av>=12",
    "sounddevice>=0.4",
    "rich>=13",
    "readchar>=4",
    "Pillow>=10",
    "requests>=2.28",
    "numpy>=1.24",
]

[project.optional-dependencies]
media-keys = ["keyboard>=0.13.5"]

[project.scripts]
termify = "termify.__main__:main"

[tool.setuptools]
packages = ["termify"]
